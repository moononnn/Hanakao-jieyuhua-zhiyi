name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # 本机开发环境是 UTC+8，涉及日期/生活日的断言跟时区绑着，跑 UTC 会挂。
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 语法检查
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $files = @('index.js')
          foreach ($dir in @('lib', 'ui/assets', 'tests')) {
            if (Test-Path $dir) {
              $files += Get-ChildItem $dir -Recurse -Include *.js,*.mjs -File |
                ForEach-Object { $_.FullName.Substring($root.Length + 1) }
            }
          }
          Write-Host "共 $($files.Count) 个文件"
          foreach ($f in $files) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { throw "语法检查失败：$f" }
          }

      - name: 全量测试（Node）
        shell: pwsh
        # 不给名单：Node 自己递归找 tests/*.test.js。tests/python-tests.mjs 不在匹配模式里，不会被当成用例。
        run: node --test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyQt6
        shell: pwsh
        # 传音樱那几个界面用例 import PyQt6，缺了会整份 import 失败而不是跳过。
        run: |
          python -m pip install --disable-pip-version-check --quiet PyQt6

      - name: 全量测试（Python）
        shell: pwsh
        env:
          # runner 上没有显示器，Qt 必须走离屏后端，否则 QApplication 起不来。
          QT_QPA_PLATFORM: offscreen
        working-directory: python
        run: python -B -m unittest discover -p "test_*.py"
