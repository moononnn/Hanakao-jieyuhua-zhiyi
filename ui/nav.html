<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知意导航</title>
  <style>
    :root {
      color-scheme: light;
      --paper: var(--bg, #f5f8f3);
      --surface: #fffdf8;
      --ink: var(--text, #35493e);
      --muted: var(--text-muted, #718077);
      --mint: #e7f1e9;
      --mint-deep: #477a66;
      --line: #e6e4da;
      font-family: "霞鹜文楷", "LXGW WenKai", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    html[data-appearance="dark"] {
      color-scheme: dark;
      --paper: var(--bg, #202923);
      --surface: #28342d;
      --ink: var(--text, #ecf2eb);
      --muted: var(--text-muted, #b1bcb3);
      --mint: #34483b;
      --mint-deep: #a5d0b5;
      --line: #3c493f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      padding: 16px 10px 12px;
      background: var(--paper);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.6;
      overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 14px; }
    .mark {
      width: 28px; height: 28px; flex: 0 0 auto; border-radius: 9px;
      background: linear-gradient(150deg, #477a66, #7fb69a);
      box-shadow: 0 4px 10px rgba(71, 122, 102, .22);
      display: grid; place-items: center; color: #fff; font-size: 13px;
    }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 9.5px; color: var(--muted); letter-spacing: .12em; }

    .group { margin-bottom: 10px; }
    .label {
      padding: 0 9px 3px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--muted);
      opacity: .7;
    }
    button {
      display: flex; align-items: center; gap: 8px;
      width: 100%; margin-bottom: 2px; padding: 7px 9px;
      border: 0; border-radius: 9px;
      background: transparent; color: var(--ink);
      font: inherit; font-size: 12.8px; text-align: left;
      cursor: pointer; transition: background .15s ease, color .15s ease;
    }
    button svg { flex: 0 0 auto; opacity: .55; }
    button:hover { background: rgba(71, 122, 102, .1); }
    button[aria-current="page"] {
      background: var(--surface);
      color: var(--mint-deep);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(66, 86, 65, .08);
    }
    button[aria-current="page"] svg { opacity: .95; }
    .foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }
    .foot button { font-size: 11.8px; color: var(--muted); }

    @media (max-width: 520px) {
      body { padding: 10px 8px; }
      .brand { padding-bottom: 8px; }
      .label { display: none; }
      .group { margin-bottom: 4px; }
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="mark" aria-hidden="true">知</div>
    <div>
      <div class="name">知意</div>
      <div class="sub">解语花</div>
    </div>
  </div>

  <div class="group">
    <button type="button" data-view="overview" aria-current="page">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.4"/><rect x="9" y="2" width="5" height="5" rx="1.4"/><rect x="2" y="9" width="5" height="5" rx="1.4"/><rect x="9" y="9" width="5" height="5" rx="1.4"/></svg>
      <span>概览</span>
    </button>
  </div>

  <div class="group">
    <div class="label">对话</div>
    <button type="button" data-view="chat">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M13.5 8.4c0 2.5-2.4 4.5-5.4 4.5-.7 0-1.4-.1-2-.3L3 13.6l.6-2.2C2.6 10.6 2 9.6 2 8.4 2 5.9 4.5 4 7.6 4s5.9 1.9 5.9 4.4Z"/></svg>
      <span>怎么回话</span>
    </button>
    <button type="button" data-view="summary">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 4.2h10M3 8h7M3 11.8h5"/></svg>
      <span>太长不看</span>
    </button>
  </div>

  <div class="group">
    <div class="label">朗读</div>
    <button type="button" data-view="voice">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 6.4v3.2h2.2L8.6 12V4L5.2 6.4H3Z"/><path d="M10.6 6.2a2.8 2.8 0 0 1 0 3.6M12.4 4.4a5.2 5.2 0 0 1 0 7.2" stroke-linecap="round"/></svg>
      <span>念出来听</span>
    </button>
  </div>

  <div class="group">
    <div class="label">自动化</div>
    <button type="button" data-view="auto">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 2.4v3M8 10.6v3M2.4 8h3M10.6 8h3"/><circle cx="8" cy="8" r="2.4"/></svg>
      <span>干完活关机</span>
    </button>
    <button type="button" data-view="resume">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 3.2v2.4h2.4" stroke-linecap="round"/></svg>
      <span>断了接上</span>
    </button>
  </div>

  <div class="group">
    <div class="label">接口</div>
    <button type="button" data-view="models">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><ellipse cx="8" cy="4.2" rx="4.6" ry="1.8"/><path d="M3.4 4.2v7.6c0 1 2 1.8 4.6 1.8s4.6-.8 4.6-1.8V4.2"/><path d="M3.4 8c0 1 2 1.8 4.6 1.8S12.6 9 12.6 8"/></svg>
      <span>模型和接口</span>
    </button>
  </div>

  <div class="foot">
    <button type="button" data-view="perm">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.4M8 5.3v.6" stroke-linecap="round"/></svg>
      <span>权限与诊断</span>
    </button>
  </div>

  <script>
    const KEY = 'zhiyiPanelView';
    const CHANNEL = 'zhiyi-panel-view';
    const buttons = [...document.querySelectorAll('button[data-view]')];
    const channel = ('BroadcastChannel' in window) ? new BroadcastChannel(CHANNEL) : null;

    function paint(view) {
      for (const button of buttons) {
        button.setAttribute('aria-current', button.dataset.view === view ? 'page' : 'false');
      }
    }

    function pick(view) {
      paint(view);
      try { localStorage.setItem(KEY, view); } catch {}
      channel?.postMessage({ view, from: 'nav' });
      // 同一窗口里的主页面也能收到，万一 BroadcastChannel 被宿主裁掉
      window.parent?.postMessage({ type: 'zhiyi-view', view }, '*');
    }

    for (const button of buttons) {
      button.addEventListener('click', () => pick(button.dataset.view));
    }

    channel?.addEventListener('message', (event) => {
      const view = event.data?.view;
      if (typeof view === 'string' && view) paint(view);
    });

    window.addEventListener('message', (event) => {
      const view = event.data?.view;
      if (event.data?.type === 'zhiyi-view-state' && typeof view === 'string') paint(view);
    });

    let remembered = '';
    try { remembered = localStorage.getItem(KEY) || ''; } catch {}
    if (remembered) paint(remembered);
  </script>
</body>
</html>
