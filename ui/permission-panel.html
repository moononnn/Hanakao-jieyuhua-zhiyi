<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>知意导航</title>
  <script src="./assets/theme-follow.js"></script>
  <style>
    :root {
      color-scheme: light;
      --paper: var(--bg, #f5f8f3);
      --surface: #fffdf8;
      --ink: var(--text, #35493e);
      --muted: var(--text-muted, #718077);
      --mint: #e7f1e9;
      --mint-deep: #477a66;
      --line: #e6e4da;
      font-family: "霞鹜文楷", "LXGW WenKai", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    html[data-appearance="dark"] {
      color-scheme: dark;
      --paper: var(--bg, #202923);
      --surface: #2f3c36;
      --ink: var(--text, #ecf2eb);
      --muted: var(--text-muted, #b1bcb3);
      --mint: #34483b;
      --mint-deep: #a5d0b5;
      --line: #47564c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      padding: 16px 10px 12px;
      background: var(--paper);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.6;
      overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 7px; padding: 0 8px 10px; }
    .mark {
      width: 40px; height: 40px; flex: 0 0 auto; border-radius: 11px;
      background: var(--mint);
      display: grid; place-items: center; color: var(--mint-deep);
    }
    .mark svg { display: block; }
    .name { font-size: 14.5px; font-weight: 600; }
    .sub { display: none; }

    .group { margin-bottom: 10px; }
    .label {
      padding: 0 9px 3px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--muted);
      opacity: .7;
    }
    button {
      display: flex; align-items: center; gap: 8px;
      width: 100%; margin-bottom: 2px; padding: 7px 9px;
      border: 0; border-radius: 9px;
      background: transparent; color: var(--ink);
      font: inherit; font-size: 12.8px; text-align: left;
      cursor: pointer; transition: background .15s ease, color .15s ease;
    }
    button svg { flex: 0 0 auto; opacity: .55; }
    button:hover { background: rgba(71, 122, 102, .1); }
    /* 当前页：整块填深绿。左侧栏里只有这一块是这个颜色，
       所以“我在哪一页”不用读字也看得出来。 */
    button[aria-current="page"] {
      background: var(--mint-deep);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(71, 122, 102, .26);
    }
    button[aria-current="page"] svg { opacity: 1; }
    html[data-appearance="dark"] button[aria-current="page"] { color: #16221b; }
    button .text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 状态点：亮着表示这个功能现在开着 */
    .dot {
      flex: 0 0 auto;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--line);
      transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .dot[data-on="1"] {
      background: #5dae8e;
      border-color: #5dae8e;
      box-shadow: 0 0 0 2px rgba(93, 174, 142, .16);
    }
    html[data-appearance="dark"] .dot[data-on="1"] { background: #7fc6a6; border-color: #7fc6a6; }

    .foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }
    .foot button { font-size: 11.8px; color: var(--muted); }

    @media (max-width: 520px) {
      body { padding: 10px 8px; }
      .brand { padding-bottom: 8px; }
      .label { display: none; }
      .group { margin-bottom: 4px; }
    }
  </style>
</head>

    </button>

  <script type="module">
    import { hana } from './assets/sdk.js';

    // 宿主靠 hana.ready() 这个报到决定面板算不算加载成功。
    // 不调它，宿主会一直等到超时，然后显示「应用加载失败」。
    hana.ready();

    const KEY = 'zhiyiPanelView';
    const CHANNEL = 'zhiyi-panel-view';
    const buttons = [...document.querySelectorAll('button[data-view]')];
    const channel = ('BroadcastChannel' in window) ? new BroadcastChannel(CHANNEL) : null;

    /* ── 切页 ── */
    function paint(view) {
      for (const button of buttons) {
        button.setAttribute('aria-current', button.dataset.view === view ? 'page' : 'false');
      }
    }

    function pick(view) {
      paint(view);
      try { localStorage.setItem(KEY, view); } catch {}
      channel?.postMessage({ view, from: 'nav' });
      // 直角兜底：宿主若裁掉 BroadcastChannel，主页面还能从这个消息收到
      window.parent?.postMessage({ type: 'zhiyi-view', view }, '*');
    }

    for (const button of buttons) {
      button.addEventListener('click', () => pick(button.dataset.view));
    }

    channel?.addEventListener('message', (event) => {
      if (event.data?.from === 'panel' && typeof event.data.view === 'string') paint(event.data.view);
    });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'zhiyi-view-state' && typeof event.data.view === 'string') paint(event.data.view);
    });

    /* ── 状态点 ── */
    function setDot(name, on) {
      const dot = document.querySelector(`[data-dot="${name}"]`);
      if (dot) dot.dataset.on = on ? '1' : '0';
    }

    async function readJson(path) {
      const response = await hana.api.fetch(path);
      if (!response.ok) throw new Error('read failed');
      return response.json();
    }

    async function refreshDots() {
      if (document.hidden) return;
      await Promise.allSettled([
        readJson('/ask-config').then((data) => setDot('ask', data?.enabled !== false)),
        readJson('/recommendation-config').then((data) => setDot('rec', data?.display !== 'off')),
        readJson('/summary-config').then((data) => setDot('summary', data?.enabled !== false)),
        readJson('/voice-config').then((data) => setDot('voice', data?.config?.enabled !== false)),
        readJson('/ball/status').then((data) => setDot('ball', data?.running === true)),
        readJson('/sleep-guard').then((data) => setDot('sleep', data?.armed === true)),
        readJson('/resume-config').then((data) => setDot('resume', data?.config?.enabled === true)),
      ]);
    }

    let remembered = '';
    try { remembered = localStorage.getItem(KEY) || ''; } catch {}
    if (remembered) paint(remembered);

    void refreshDots();
    setInterval(() => { void refreshDots(); }, 6000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') void refreshDots();
    });
  </script>
